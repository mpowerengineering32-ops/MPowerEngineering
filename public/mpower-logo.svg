<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0038D1" />
      <stop offset="100%" stop-color="#002699" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- MPower Main Title -->
    <text x="10" y="78" font-family="'Kanit', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="800" fill="url(#blueGrad)" letter-spacing="-1.5">MPower</text>
    
    <!-- Electrical Waveform & Power Plug -->
    <g transform="translate(95, 84)">
      <!-- Sine/ECG Wave Line -->
      <path d="M 0 0 L 35 0 L 48 -26 L 62 22 L 76 -38 L 90 28 L 102 -12 L 115 0 L 175 0" 
            fill="none" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Power Plug Head -->
      <path d="M 175 -7 L 184 -7 L 186 -11 L 192 -11 L 192 11 L 186 11 L 184 7 L 175 7 Z" fill="url(#goldGrad)"/>
      <!-- Prongs -->
      <rect x="192" y="-8" width="8" height="4" rx="1" fill="url(#goldGrad)"/>
      <rect x="192" y="4" width="8" height="4" rx="1" fill="url(#goldGrad)"/>
    </g>
    
    <!-- Engineering Solutions Subtitle -->
    <text x="290" y="122" font-family="'Kanit', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="url(#blueGrad)">Engineering Solutions</text>
  </g>
</svg>
